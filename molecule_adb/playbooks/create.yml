---
- name: Playbook for Android devices creation on emulator host
  hosts: "{{ loopkup(env, 'MOLECULE_ADB_HOST') | d('localhost') }}"
  gather_facts: false
  vars:
    termux_apk_build: https://github.com/termux/termux-app/releases/download/v0.119.0-beta.3/termux-app_v0.119.0-beta.3+apt-android-7-github-debug_arm64-v8a.apk

  tasks:
    - name: Create | Reload adb server
      ansible.builtin.import_role:
        name: reload_adb

    - name: Create | Use avdmanager create command
      ansible.builtin.include_role:
        name: avd
      loop: "{{ molecule_yml.platforms }}"

    - name: Create | Get next len(platforms) ports
      free_ports:
        count: "{{ molecule_yml.platforms | length }}"
        # There are two ports opening on device.
        # one for console port, one for adb port
        step: 10
      register: molecule_create_free_ports_result

    - name: Create | Merge platforms with ports
      ansible.builtin.set_fact:
        platforms_with_ports: >-
          {{
            platforms_with_ports | d([]) + [item | combine({ "port": molecule_create_free_ports_result.free_ports[platform_index]})]
          }}
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        index_var: platform_index

    - name: Create | Save accociation between platform and port
      ansible.builtin.set_fact:
        molecule_yml: >-
          {{
            molecule_yml | combine({ 'platforms': platforms_with_ports})
          }}

    - name: Create | Run devices on emulator
      ansible.builtin.shell: >-
        emulator -avd '{{ item.name }}' -port {{ item.port }} {{ '-no-window' if item.no_ui | d(true) else '' }} -gpu host -feature 'Vulkan' &
        echo $!
      register: emulator_results
      loop: "{{ molecule_yml.platforms }}" 

    - name: Create | Wait until devices are online
      ansible.builtin.shell: >-
        adb devices | grep "emulator-{{ item.port }}" | awk '{ print $2 }'
      register: adb_device_attach_status
      until: adb_device_attach_status.stdout == "device"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create | Save path to termux_apk_build
      ansible.builtin.set_fact:
        termux_distr_tmp_path: "/tmp/{{ (termux_apk_build | split('/'))[-1] }}"

    - name: Create | Download termux distr from remote source
      ansible.builtin.get_url:
        url: "{{ termux_apk_build }}"
        dest: "{{ termux_distr_tmp_path }}"

    - name: Create | Install termux on android device
      ansible.builtin.command: >-
        adb -s emulator-{{ item.port }} install
        -r "{{ termux_distr_tmp_path }}"
      register: adb_termux_install_result
      until: adb_termux_install_result.rc == 0
      retries: 20
      delay: 15
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create | Start android devices as root
      ansible.builtin.command: >-
        adb -s emulator-{{ item.port }} root
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create | Init termux
      ansible.builtin.command: >-
        adb -s emulator-{{ item.port }} shell
        am start -n com.termux/.HomeActivity 'ls -al'
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create | Check if shell is available
      ansible.builtin.command: >-
        adb -s emulator-{{ item.port }} shell 'ls /data/data/com.termux/files/usr/bin/bash'
      register: adb_termux_check_shell
      until: adb_termux_check_shell.rc == 0
      retries: 20
      delay: 1
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create | Define termux user
      ansible.builtin.shell: >-
        adb -s emulator-{{ item.port }} shell
        "stat -c '%U:%G' /data/data/com.termux/files/home/"
      register: termux_user_result
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create | Add user and group to platforms
      ansible.builtin.set_fact:
        platforms_with_users: >-
          {{
            platforms_with_users | d([]) + [item.item | combine({"termux_ownership": item.stdout.strip()})]
          }}
      loop: "{{ termux_user_result.results }}"
    
    - name: Create | Update molecule_yml.platforms
      ansible.builtin.set_fact:
        molecule_yml: >-
          {{
            molecule_yml | combine({ 'platforms': platforms_with_users})
          }}

    - name: Create | Import role for ssh keys pair preparation
      ansible.builtin.import_role:
        name: ssh_keys

    - name: Create | Populate instance config
      ansible.builtin.set_fact:
        instance_conf_dict:
          "verbose_name": "{{ item.name }}"
          "android_api_level": "{{ item.android_api_level }}"
          "api_profile": "{{ item.api_profile }}"
          "arch": "{{ item.arch }}"
          "ansible_user": "{{ item.termux_ownership | split(':') | first }}"
          "ansible_host": "{{ item.host | default('localhost') }}"
          "ansible_port": "{{ item.ssh_port | d((item.port | int + 22) | string) }}"
          "public_ssh_key_file": "{{ item.public_ssh_key_file }}"
          "private_ssh_key_file": "{{ item.private_ssh_key_file }}"
          "emulator_pid": "{{ (emulator_results.results | selectattr('item.name', 'equalto', item.name) | first).stdout_lines | first | int }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: i
      register: instance_config_dict

    - name: Create | Convert instance config dict to a list
      ansible.builtin.set_fact:
        instance_conf: "{{ instance_config_dict.results | map(attribute='ansible_facts.instance_conf_dict') | list }}"

    - name: Create | Dump instance config
      ansible.builtin.copy:
        content: "{{ instance_conf | to_yaml }}"
        dest: "{{ molecule_instance_config }}"
        mode: "0600"

    - name: Create | Save hosts to ansible host vars
      ansible.builtin.add_host:
        hostname: "{{ item.verbose_name }}"
        ansible_ssh_host: "{{ item.ansible_host }}"
        ansible_ssh_port: "{{ item.ansible_port }}"
        ansible_ssh_user: "{{ item.ansible_user }}"
        ansible_ssh_private_key_file: "{{ item.private_ssh_key_file }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups:
          - created_android_devices
      loop: "{{ instance_conf }}"

    - name: Create | Import role for termux repofile configuration
      ansible.builtin.import_role:
        name: termux_repo

    - name: Create | Import role for ssh setup
      ansible.builtin.import_role:
        name: avd_ssh


- name: Play that sets
  hosts: created_android_devices
  gather_facts: false

  tasks:
    - name: Pre config | Install python3
      ansible.builtin.raw: >-
        pkg install python -y
